<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>واقعیت افزوده - MindAR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Tahoma, Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }

    a-scene canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2;
    }

    video[data-mindar-video] {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    #topbar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      min-width: 180px;
      padding: 10px 18px;
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 22px;
      text-align: center;
      font-size: 15px;
      pointer-events: none;
    }

    #sound-btn {
      position: fixed;
      right: 16px;
      bottom: 95px;
      z-index: 1100;
      display: none;
      padding: 12px 20px;
      border: 0;
      border-radius: 24px;
      color: #fff;
      background: #2563eb;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #sound-btn.unmuted {
      background: #16a34a;
    }

    #log {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 1000;
      height: 75px;
      box-sizing: border-box;
      padding: 6px;
      overflow-y: auto;
      direction: ltr;
      color: #00ff88;
      background: rgba(0, 0, 0, 0.85);
      font: 11px/1.3 monospace;
      text-align: left;
      border-radius: 6px;
    }

    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      color: #fff;
      background: #111;
      text-align: center;
    }

    #start-btn {
      border: 0;
      border-radius: 28px;
      padding: 14px 28px;
      color: #fff;
      background: #2563eb;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>

  <script>
    // کامپوننت اختصاصی Three.js برای ساخت پلین و رندر پیوسته فریم‌های ویدیو
    AFRAME.registerComponent('video-mesh-plane', {
      schema: {
        videoSelector: { type: 'string' },
        width: { type: 'number', default: 1 },
        height: { type: 'number', default: 0.5625 }
      },
      init: function () {
        const videoEl = document.querySelector(this.data.videoSelector);
        if (!videoEl) {
          console.error('Video element not found:', this.data.videoSelector);
          return;
        }

        this.video = videoEl;
        this.texture = new THREE.VideoTexture(this.video);
        this.texture.minFilter = THREE.LinearFilter;
        this.texture.magFilter = THREE.LinearFilter;
        this.texture.format = THREE.RGBAFormat;

        const geometry = new THREE.PlaneGeometry(this.data.width, this.data.height);
        const material = new THREE.MeshBasicMaterial({
          map: this.texture,
          side: THREE.DoubleSide
        });

        this.mesh = new THREE.Mesh(geometry, material);
        this.el.setObject3D('mesh', this.mesh);
      },
      tick: function () {
        if (this.video && this.video.readyState >= this.video.HAVE_CURRENT_DATA && this.texture) {
          this.texture.needsUpdate = true;
        }
      }
    });
  </script>
</head>

<body>
  <div id="start-screen">
    <p id="start-msg">برای شروع، دسترسی به دوربین و صدا را تأیید کنید</p>
    <button id="start-btn">شروع تجربه واقعیت افزوده</button>
  </div>

  <div id="topbar">در انتظار بارگذاری...</div>

  <button id="sound-btn">🔊 فعال‌سازی صدا</button>

  <div id="log"></div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    mindar-image="
      imageTargetSrc: ./assets/targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      maxTrack: 2;
    "
  >
    <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>

    <a-entity id="main-root"></a-entity>
  </a-scene>

  <script>
    const logBox = document.getElementById('log');
    const topbar = document.getElementById('topbar');
    const root = document.getElementById('main-root');
    const soundButton = document.getElementById('sound-btn');
    const startScreen = document.getElementById('start-screen');
    const startMsg = document.getElementById('start-msg');
    const startBtn = document.getElementById('start-btn');

    const activeVideos = [];
    let isUserUnmuted = false;

    function log(msg) {
      logBox.textContent += msg + '\n';
      logBox.scrollTop = logBox.scrollHeight;
      console.log(msg);
    }

    function setStatus(msg) {
      topbar.textContent = msg;
    }

    function markCameraVideo(v) {
      if (!v) return;
      v.setAttribute('data-mindar-video', '');
      v.style.position = 'fixed';
      v.style.left = '0';
      v.style.top = '0';
      v.style.width = '100vw';
      v.style.height = '100vh';
      v.style.objectFit = 'cover';
      v.style.zIndex = '0';
    }

    function fixCameraDOM() {
      const allVideos = document.querySelectorAll('video');
      allVideos.forEach((v) => {
        if (v.srcObject && !v.dataset.arVideo) {
          markCameraVideo(v);
        }
      });
    }

    function startCameraWatcher() {
      fixCameraDOM();
      const observer = new MutationObserver(fixCameraDOM);
      observer.observe(document.body, { childList: true, subtree: true });
      const interval = setInterval(fixCameraDOM, 500);
      setTimeout(() => clearInterval(interval), 15000);
    }

    async function loadConfig() {
      const response = await fetch('./config.json?v=' + Date.now());
      if (!response.ok) throw new Error('config.json HTTP ' + response.status);
      return await response.json();
    }

    function updateSoundButtonUI() {
      if (isUserUnmuted) {
        soundButton.textContent = '🔈 قطع صدا';
        soundButton.classList.add('unmuted');
      } else {
        soundButton.textContent = '🔊 فعال‌سازی صدا';
        soundButton.classList.remove('unmuted');
      }
    }

    soundButton.addEventListener('click', () => {
      isUserUnmuted = !isUserUnmuted;
      updateSoundButtonUI();

      activeVideos.forEach((item) => {
        item.video.muted = !isUserUnmuted;
      });
      log('Sound toggled: ' + (isUserUnmuted ? 'ON' : 'OFF'));
    });

    async function startAR() {
      try {
        log('Loading config...');
        const config = await loadConfig();

        // 1. بارگذاری مدل‌های سه‌بعدی
        if (Array.isArray(config.models)) {
          config.models.forEach((item) => {
            const [index, path, scale, position] = item;
            const anchor = document.createElement('a-entity');
            anchor.setAttribute('mindar-image-target', `targetIndex: ${index}`);

            const model = document.createElement('a-gltf-model');
            model.setAttribute('src', path);
            model.setAttribute('scale', scale || '1 1 1');
            model.setAttribute('position', position || '0 0 0');

            anchor.appendChild(model);
            root.appendChild(anchor);

            anchor.addEventListener('targetFound', () => setStatus('مدل ۳بعدی شناسایی شد'));
            anchor.addEventListener('targetLost', () => setStatus('در انتظار تصویر...'));
          });
        }

        // 2. بارگذاری ویدیوها روی آبجکت Plane سه‌بعدی سفارشی
        if (Array.isArray(config.videos)) {
          config.videos.forEach((item, i) => {
            const [index, path, scaleStr, posStr] = item;
            const videoId = 'ar-video-node-' + i;

            const video = document.createElement('video');
            video.id = videoId;
            video.dataset.arVideo = "true";
            video.src = path;
            video.loop = true;
            video.muted = true;
            video.playsInline = true;
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.crossOrigin = 'anonymous';
            video.preload = 'auto';
            video.style.display = 'none';
            document.body.appendChild(video);

            const anchor = document.createElement('a-entity');
            anchor.setAttribute('mindar-image-target', `targetIndex: ${index}`);

            const planeEntity = document.createElement('a-entity');
            planeEntity.setAttribute('video-mesh-plane', `videoSelector: #${videoId}; width: 1; height: 0.5625;`);
            planeEntity.setAttribute('scale', scaleStr || '1 1 1');
            planeEntity.setAttribute('position', posStr || '0 0 0');

            anchor.appendChild(planeEntity);
            root.appendChild(anchor);

            const videoRecord = { index, video };
            activeVideos.push(videoRecord);

            anchor.addEventListener('targetFound', async () => {
              setStatus('ویدیو شناسایی شد');
              log('Target ' + index + ' found');
              soundButton.style.display = 'block';

              video.muted = !isUserUnmuted;
              try {
                await video.play();
                log('Video playing...');
              } catch (err) {
                log('Play error: ' + err.message);
              }
            });

            anchor.addEventListener('targetLost', () => {
              video.pause();
              setStatus('در انتظار تصویر...');
              log('Target ' + index + ' lost');
            });
          });
        }

        // فعال‌سازی اولیه مجوز ویدیوها
        for (const item of activeVideos) {
          try {
            await item.video.play();
            item.video.pause();
            item.video.currentTime = 0;
          } catch (e) {}
        }

        startScreen.remove();

        const scene = document.querySelector('a-scene');
        const mindarSystem = scene.systems['mindar-image-system'];
        if (!mindarSystem) throw new Error('MindAR system unavailable');

        scene.addEventListener('arReady', () => {
          setStatus('دوربین فعال شد - تصویر را روبروی دوربین بگیرید');
          startCameraWatcher();
        });

        mindarSystem.start();
        startCameraWatcher();

      } catch (err) {
        setStatus('خطا در اجرا');
        log('Error: ' + err.message);
        startMsg.textContent = 'خطا: ' + err.message;
        startBtn.style.display = 'block';
      }
    }

    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      startMsg.textContent = 'در حال راه‌اندازی دوربین...';
      startAR();
    });
  </script>
</body>
</html>
