<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>WebAR</title>

  <script src="https://af.2/aframe.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    /* a-scene تمام صفحه */
    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      background: #000 !important;
    }

    /* canvas و ویدئوی دوربین تمام صفحه */
    canvas, video {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;  /* مهم: سیاهی پایین را حذف می‌کند */
    }

    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      padding: 10px 12px;
      color: #fff;
      background: rgba(0,0,0,0.45);
      text-align: center;
      font-size: 14px;
      backdrop-filter: blur(4px);
    }

    #log {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 9999;
      max-height: 35vh;
      overflow: auto;
      background: rgba(0,0,0,0.6);
      color: #ffdddd;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.4;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      direction: ltr; /* برای خوانایی URLها */
      white-space: pre-wrap;
    }

    #hint {
      position: fixed;
      inset: auto 0 55px 0;
      z-index: 9999;
      text-align: center;
      color: #fff;
      font-size: 12px;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div id="topbar">در حال آماده‌سازی… اگر پیام خطا دیدید، از پایین صفحه عکس بگیرید.</div>
  <div id="hint">اگر دوربین اجازه می‌خواهد: Allow را بزنید. (بهتر: Chrome/Android)</div>
  <div id="log"></div>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 1000;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true, physicallyCorrectLights: true"
  >
    <a-assets timeout="10000"></a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="root"></a-entity>
  </a-scene>

  <script>
    const $top = document.getElementById('topbar');
    const $log = document.getElementById('log');
    const log = (...args) => {
      const msg = args.map(a => (typeof a === 'string' ? a : JSON.stringify(a))).join(' ');
      console.log(msg);
      $log.textContent += msg + "\n";
      $log.scrollTop = $log.scrollHeight;
    };

    // نمایش خطاهای کلی JS
    window.addEventListener('error', (e) => log('[window.error]', e.message));
    window.addEventListener('unhandledrejection', (e) => log('[promise]', e.reason?.message || e.reason));

    async function mustFetch(url, kind) {
      log(`Fetching ${kind}: ${url}`);
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`${kind} not found (${res.status}): ${url}`);
      return res;
    }

      try {
        // 1) چک targets.mind
        await mustFetch('./assets/targets.mind', 'targets.mind');

        // 2) چک config.json
        const cfgRes = await mustFetch('./config.json', 'config.json');
        const cfg = await cfgRes.json();

        log('config.json loaded OK');

        const sceneEl = document.querySelector('a-scene');
        const root = document.getElementById('root');
