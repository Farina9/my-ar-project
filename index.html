<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Experience - Dual Mode</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #topbar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 100; padding: 10px 20px; color: white; background: rgba(0,0,0,0.6); border-radius: 20px; font-family: sans-serif; pointer-events: none; }
    #log { position: fixed; bottom: 10px; left: 10px; right: 10px; height: 80px; background: rgba(0,0,0,0.8); color: #0f6; font-family: monospace; font-size: 10px; padding: 5px; overflow-y: auto; z-index: 100; }
    #start-screen { position: fixed; inset: 0; z-index: 999; background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 30px; border: none; background: #2563eb; color: white; font-weight: bold; }
  </style>
</head>
<body>

  <div id="start-screen">
    <button id="start-btn">شروع تجربه واقعیت افزوده</button>
  </div>

  <div id="topbar">در انتظار دوربین...</div>
  <div id="log"></div>

  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiLoading: no;" 
    embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets id="assets-container"></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="main-root"></a-entity>
  </a-scene>

  <script>
    const $log = document.getElementById('log');
    const $top = document.getElementById('topbar');
    const $root = document.getElementById('main-root');
    const $assets = document.getElementById('assets-container');

    function log(m) { $log.innerText += m + "\n"; $log.scrollTop = $log.scrollHeight; }

    async function startAR() {
      try {
        log("Loading config.json...");
        const res = await fetch('./config.json?v=' + Math.random());
        const cfg = await res.json();
        
        // ۱. پردازش مدل‌ها
        if(cfg.models) {
          cfg.models.forEach(m => {
            const [idx, path, scale, pos, rot] = m;
            const anchor = document.createElement('a-entity');
            anchor.setAttribute('mindar-image-target', `targetIndex: ${idx}`);
            
            const model = document.createElement('a-gltf-model');
            model.setAttribute('src', path);
            model.setAttribute('scale', scale || "1 1 1");
            model.setAttribute('position', pos || "0 0 0");
            if(rot) model.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear');
            
            anchor.appendChild(model);
            $root.appendChild(anchor);
            
            anchor.addEventListener('targetFound', () => { $top.innerText = "مدل شناسایی شد"; log("Model Found: " + idx); });
          });
        }

        // ۲. پردازش ویدیوها
        if(cfg.videos) {
          cfg.videos.forEach((v, i) => {
            const [idx, path, scale, pos] = v;
            const anchor = document.createElement('a-entity');
            anchor.setAttribute('mindar-image-target', `targetIndex: ${idx}`);
            
            // ساخت ویدیو
            const videoId = `vid-${i}`;
            const videoEl = document.createElement('video');
            videoEl.id = videoId;
            videoEl.src = path;
            videoEl.loop = true;
            videoEl.crossOrigin = "anonymous";
            videoEl.setAttribute('playsinline', '');
            $assets.appendChild(videoEl);

            const plane = document.createElement('a-plane');
            plane.setAttribute('src', `#${videoId}`);
            plane.setAttribute('width', '1');
            plane.setAttribute('height', '0.56');
            plane.setAttribute('scale', scale || "1 1 1");
            plane.setAttribute('position', pos || "0 0 0");
            
            anchor.appendChild(plane);
            $root.appendChild(anchor);

            anchor.addEventListener('targetFound', () => {
              $top.innerText = "ویدیو شناسایی شد";
              log("Video Found: " + idx);
              videoEl.play().catch(e => log("Play Error: " + e.message));
            });
            anchor.addEventListener('targetLost', () => videoEl.pause());
          });
        }

        const scene = document.querySelector('a-scene');
        scene.systems['mindar-image-system'].start();
        log("AR System Started.");

      } catch (e) {
        log("Global Error: " + e.message);
      }
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('start-screen').remove();
      startAR();
    });
  </script>
</body>
</html>
