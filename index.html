<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>WebAR Experience</title>

  <!-- کتابخانه‌های اصلی و معتبر CDN -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: #000 !important;
    }

    canvas, video {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #topbar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      padding: 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      text-align: center;
      font-size: 14px;
      border-radius: 10px;
      backdrop-filter: blur(5px);
    }

    #start-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }

    #log {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      max-height: 25vh;
      overflow: auto;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff88;
      padding: 10px;
      font-size: 11px;
      font-family: monospace;
      border-radius: 8px;
      direction: ltr;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="topbar">در حال آماده‌سازی سیستم... روی دکمه شروع کلیک کنید.</div>
  <button id="start-btn" onclick="startAR()">شروع دوربین و واقعیت افزوده</button>
  <div id="log"></div>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiLoading: no; uiError: no;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true, physicallyCorrectLights: true"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="root"></a-entity>
  </a-scene>

  <script>
    const $top = document.getElementById('topbar');
    const $log = document.getElementById('log');
    const $btn = document.getElementById('start-btn');

    function log(msg) {
      console.log(msg);
      $log.textContent += msg + "\n";
      $log.scrollTop = $log.scrollHeight;
    }

    window.onerror = (msg, url, line) => log(`[Error] ${msg} (Line ${line})`);

    async function startAR() {
      $btn.style.display = 'none';
      $top.textContent = 'در حال فعال‌سازی دوربین...';

      try {
        // 1. بررسی فایل targets.mind
        log('Checking targets.mind...');
        const tRes = await fetch('./assets/targets.mind', { method: 'HEAD' });
        if (!tRes.ok) throw new Error('فایل targets.mind در پوشه assets یافت نشد (404)');

        // 2. بارگذاری config.json
        log('Loading config.json...');
        let cfg = { models: [] };
        try {
          const cRes = await fetch('./config.json');
          if (cRes.ok) cfg = await cRes.json();
        } catch (e) {
          log('Warning: config.json not found, loading default.');
        }

        // 3. افزودن مدل‌ها به صحنه
        const root = document.getElementById('root');
        const models = cfg.models || [];
        
        models.forEach((item) => {
          const [idx, path, scale, pos, autoRot] = item;
          const anchor = document.createElement('a-entity');
          anchor.setAttribute('mindar-image-target', `targetIndex: ${idx}`);

          anchor.addEventListener('targetFound', () => {
            $top.textContent = `تارگت ${idx} شناسایی شد!`;
            log(`Target ${idx} Found`);
          });

          anchor.addEventListener('targetLost', () => {
            $top.textContent = 'دوربین را به سمت تصویر بگیرید...';
            log(`Target ${idx} Lost`);
          });

          const model = document.createElement('a-gltf-model');
          model.setAttribute('src', path);
          if (scale) model.setAttribute('scale', scale);
          if (pos) model.setAttribute('position', pos);
          if (autoRot) {
            model.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear');
          }

          anchor.appendChild(model);
          root.appendChild(anchor);
        });

        // 4. استارت سیستم AR
        const sceneEl = document.querySelector('a-scene');
        const arSystem = sceneEl.systems['mindar-image-system'];
        
        sceneEl.addEventListener('arReady', () => {
          $top.textContent = 'آماده! دوربین را به سمت تصویر بگیرید.';
          log('MindAR Ready');
        });

        sceneEl.addEventListener('arError', (err) => {
          $top.textContent = 'خطا در اجرای دوربین.';
          log('AR Error: ' + JSON.stringify(err));
        });

        await arSystem.start();
        log('AR System started successfully.');

      } catch (err) {
        $top.textContent = 'خطا در بارگذاری!';
        log('FATAL: ' + err.message);
      }
    }
  </script>
</body>
</html>
