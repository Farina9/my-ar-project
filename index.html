<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebAR Experience</title>

  <!-- کتابخانه‌ها -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: transparent !important;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ویدیوی دوربین */
    video:not(.ar-media-video) {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      display: block !important;
    }

    a-scene {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      z-index: 2 !important;
    }

    #topbar {
      position: fixed;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      padding: 10px 20px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.7);
      text-align: center;
      font-size: 14px;
      border-radius: 25px;
      backdrop-filter: blur(6px);
      white-space: nowrap;
      pointer-events: none;
    }

    #log {
      position: fixed;
      bottom: 10px; left: 10px; right: 10px;
      max-height: 85px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      color: #00ff66;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 8px;
      z-index: 100;
      direction: ltr;
      white-space: pre-wrap;
    }

    /* پرده شروع برای فعال‌سازی قطعی صدا و تصویر */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    #start-btn {
      margin-top: 20px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>

<body>
  <div id="start-overlay">
    <h2>سامانه واقعیت افزوده</h2>
    <p>برای شروع تجربه و دسترسی به ویدیوها، دکمه زیر را لمس کنید.</p>
    <button id="start-btn">ورود و شروع دوربین</button>
  </div>

  <div id="topbar">در حال آماده‌سازی دوربین...</div>
  <div id="log"></div>

  <!-- تگ assets داخلی A-Frame برای پری‌لود و هندل امن ویدیو -->
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true, alpha: true, antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets id="a-assets-container"></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="root"></a-entity>
  </a-scene>

  <script>
    const $top = document.getElementById('topbar');
    const $log = document.getElementById('log');
    const $overlay = document.getElementById('start-overlay');
    const $startBtn = document.getElementById('start-btn');
    const $assets = document.getElementById('a-assets-container');
    const sceneEl = document.querySelector('a-scene');

    function log(msg) {
      console.log(msg);
      $log.textContent += msg + "\n";
      $log.scrollTop = $log.scrollHeight;
    }

    window.onerror = (msg, url, line) => log(`[Err] ${msg}:${line}`);

    async function buildScene() {
      try {
        log('Fetching config.json...');
        let cfg = { models: [] };
        try {
          const res = await fetch('./config.json', { cache: 'no-store' });
          if (res.ok) cfg = await res.json();
        } catch (e) {
          log('Config not found, using default');
        }

        const root = document.getElementById('root');
        const items = cfg.models || [];

        items.forEach((item, index) => {
          const [idx, path, scale, pos, autoRot] = item;
          const isVideo = path.toLowerCase().endsWith('.mp4') || path.toLowerCase().endsWith('.webm');

          const anchor = document.createElement('a-entity');
          anchor.setAttribute('mindar-image-target', `targetIndex: ${idx}`);

          if (isVideo) {
            const vId = `media-video-${index}`;

            // ۱. ساخت تگ ویدیوی استاندارد در assets
            const vid = document.createElement('video');
            vid.id = vId;
            vid.src = path;
            vid.className = 'ar-media-video';
            vid.setAttribute('crossorigin', 'anonymous');
            vid.setAttribute('playsinline', '');
            vid.setAttribute('webkit-playsinline', '');
            vid.preload = 'auto';
            vid.loop = true;
            vid.muted = false;
            $assets.appendChild(vid);

            // ۲. صفحه مشبک (Plane) برای نمایش تکسچر ویدیو روی تارگت
            const plane = document.createElement('a-plane');
            plane.setAttribute('src', `#${vId}`);
            plane.setAttribute('width', '1');
            plane.setAttribute('height', '0.5625');
            plane.setAttribute('position', pos || '0 0 0');
            plane.setAttribute('scale', scale || '1 1 1');

            anchor.appendChild(plane);

            anchor.addEventListener('targetFound', () => {
              $top.textContent = `تارگت ${idx} شناسایی شد (پخش ویدیو)`;
              log(`Target ${idx} Found -> Playing video`);
              vid.play().catch(err => {
                log('Play blocked: ' + err.message);
                vid.muted = true;
                vid.play();
              });
            });

            anchor.addEventListener('targetLost', () => {
              $top.textContent = 'دوربین را به سمت تصویر بگیرید...';
              log(`Target ${idx} Lost`);
              vid.pause();
            });

          } else {
            // ساخت مدل سه‌بعدی
            const model = document.createElement('a-gltf-model');
            model.setAttribute('src', path);
            if (scale) model.setAttribute('scale', scale);
            if (pos) model.setAttribute('position', pos);
            if (autoRot) {
              model.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear');
            }

            anchor.appendChild(model);

            anchor.addEventListener('targetFound', () => {
              $top.textContent = `تارگت ${idx} شناسایی شد!`;
              log(`Target ${idx} Found (Model)`);
            });

            anchor.addEventListener('targetLost', () => {
              $top.textContent = 'دوربین را به سمت تصویر بگیرید...';
            });
          }

          root.appendChild(anchor);
        });

        sceneEl.addEventListener('arReady', () => {
          $top.textContent = 'آماده! دوربین را به سمت تصویر بگیرید.';
          log('AR System Ready');
        });

      } catch (err) {
        log('Init error: ' + err.message);
      }
    }

    $startBtn.addEventListener('click', () => {
      $overlay.style.display = 'none';
      buildScene();
      const mindarSystem = sceneEl.systems['mindar-image-system'];
      if (mindarSystem) {
        mindarSystem.start();
      }
    });
  </script>
</body>
</html>
