<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebAR Experience</title>

  <!-- کتابخانه‌ها -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* اجبار نمایش تصویر زنده دوربین در کل پس‌زمینه */
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      display: block !important;
    }

    /* صحنه سه بعدی در لایه روی ویدیو و کاملاً شفاف */
    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2 !important;
    }

    .a-canvas {
      background-color: transparent !important;
    }

    #topbar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      padding: 10px 20px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.65);
      text-align: center;
      font-size: 14px;
      border-radius: 25px;
      backdrop-filter: blur(6px);
      white-space: nowrap;
      pointer-events: none;
    }

    #log {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      max-height: 80px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.7);
      color: #00ff66;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 8px;
      z-index: 100;
      direction: ltr;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="topbar">در حال آماده‌سازی دوربین...</div>
  <div id="log"></div>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true, alpha: true, antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="root"></a-entity>
  </a-scene>

  <script>
    const $top = document.getElementById('topbar');
    const $log = document.getElementById('log');

    function log(msg) {
      console.log(msg);
      $log.textContent += msg + "\n";
      $log.scrollTop = $log.scrollHeight;
    }

    window.onerror = (msg, url, line) => log(`[Err] ${msg}:${line}`);

    async function initAR() {
      try {
        log('Loading config.json...');
        let cfg = { models: [] };
        try {
          const res = await fetch('./config.json', { cache: 'no-store' });
          if (res.ok) cfg = await res.json();
        } catch (e) {
          log('Config fallback to default');
        }

        const root = document.getElementById('root');
        const models = cfg.models || [];

        models.forEach((item) => {
          const [idx, path, scale, pos, autoRot] = item;
          const anchor = document.createElement('a-entity');
          anchor.setAttribute('mindar-image-target', `targetIndex: ${idx}`);

          anchor.addEventListener('targetFound', () => {
            $top.textContent = `تارگت ${idx} شناسایی شد!`;
          });

          anchor.addEventListener('targetLost', () => {
            $top.textContent = 'دوربین را به سمت تصویر بگیرید...';
          });

          const model = document.createElement('a-gltf-model');
          model.setAttribute('src', path);
          if (scale) model.setAttribute('scale', scale);
          if (pos) model.setAttribute('position', pos);
          if (autoRot) {
            model.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear');
          }

          anchor.appendChild(model);
          root.appendChild(anchor);
        });

        const sceneEl = document.querySelector('a-scene');
        sceneEl.addEventListener('arReady', () => {
          $top.textContent = 'آماده! دوربین را به سمت تصویر بگیرید.';
          log('AR Ready: Camera feed active');
        });

      } catch (err) {
        $top.textContent = 'خطا در بارگذاری';
        log('Error: ' + err.message);
      }
    }

    initAR();
  </script>
</body>
</html>
