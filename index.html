<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body, html { margin: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    #msg { position: fixed; top: 10px; width: 100%; text-align: center; z-index: 1000; color: white; font-family: sans-serif; background: rgba(0,0,0,0.5); padding: 10px 0; }
    #error-log { position: fixed; bottom: 10px; left: 10px; color: red; font-size: 10px; z-index: 2000; background: white; }
    /* این کد بخش سیاه را حذف می‌کند */
    .mindar-ui-overlay { display: none !important; }
    </style>
</head>
<body>
    <div id="msg">در حال بارگذاری... دوربین را به سمت تصویر بگیرید</div>
    <div id="error-log"></div>

    <a-scene  mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="root"></a-entity>
    </a-scene>

    <script>
        const log = (txt) => { document.getElementById('error-log').innerHTML += txt + '<br>'; };
        
        fetch('./config.json')
            .then(response => {
                if (!response.ok) throw new Error('فایل config.json پیدا نشد!');
                return response.json();
            })
            .then(CONFIG => {
                const root = document.getElementById('root');
                document.getElementById('msg').innerText = "آماده! دوربین را به سمت تصویر بگیرید";

                (CONFIG.models || []).forEach(([idx, path, scale, pos, autoRot]) => {
                    const anchor = document.createElement('a-entity');
                    anchor.setAttribute('mindar-image-target', `targetIndex: ${idx}`);
                    
                    const model = document.createElement('a-gltf-model');
                    model.setAttribute('src', path);
                    model.setAttribute('scale', scale);
                    model.setAttribute('position', pos);
                    
                    if(autoRot) {
                        model.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear');
                    }

                    anchor.appendChild(model);
                    root.appendChild(anchor);
                    
                    // تست لود شدن مدل
                    model.addEventListener('model-error', () => log("خطا در بارگذاری مدل: " + path));
                });
            })
            .catch(err => log("خطای کلی: " + err.message));
    </script>
</body>
</html>
