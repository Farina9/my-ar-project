<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>واقعیت افزوده</title>

  <!-- بارگذاری CDNها -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; background: #101318; font-family: sans-serif;
    }
    a-scene {
      position: fixed !important; inset: 0 !important;
      width: 100% !important; height: 100% !important; z-index: 1 !important;
    }
    video[data-ar-camera="true"] {
      position: fixed !important; inset: 0 !important;
      width: 100vw !important; height: 100vh !important;
      object-fit: cover !important; z-index: 0 !important;
    }
    #start-overlay {
      position: fixed; inset: 0; z-index: 999999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; color: white; background: #101318; text-align: center;
    }
    #start-button {
      border: none; border-radius: 25px; padding: 16px 36px;
      color: white; background: #2563eb; font-size: 18px; font-weight: bold;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #status {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      z-index: 10000; padding: 8px 16px; border-radius: 20px;
      color: white; background: rgba(0,0,0,0.8); font-size: 14px; pointer-events: none;
    }
    #log {
      position: fixed; top: 50px; left: 10px; right: 10px; z-index: 100000;
      max-height: 120px; padding: 8px; overflow-y: auto; border-radius: 6px;
      color: #00ff88; background: rgba(0, 0, 0, 0.9); direction: ltr;
      font: 12px/1.4 monospace; text-align: left; pointer-events: none;
    }
    video.ar-content-video {
      position: fixed; left: -10px; top: -10px; width: 2px; height: 2px; opacity: 0.01;
    }
  </style>

  <script>
    AFRAME.registerComponent('video-texture-plane', {
      schema: { videoSelector: { type: 'string' } },
      init: function () {
        this.video = document.querySelector(this.data.videoSelector);
        if (!this.video) return;
        this.texture = new THREE.VideoTexture(this.video);
        const geometry = new THREE.PlaneGeometry(1, 0.5625);
        const material = new THREE.MeshBasicMaterial({ map: this.texture, side: THREE.DoubleSide });
        this.mesh = new THREE.Mesh(geometry, material);
        this.el.setObject3D('mesh', this.mesh);
      },
      tick: function () {
        if (this.video && this.texture && this.video.readyState >= 2) {
          this.texture.needsUpdate = true;
        }
      }
    });
  </script>
</head>
<body>

  <div id="start-overlay">
    <h2>تجربه واقعیت افزوده</h2>
    <p>نسخه جدید (ورژن ۳)</p>
    <button id="start-button" onclick="runAR()">شروع تجربه</button>
  </div>

  <div id="status">آماده برای شروع</div>
  <div id="log">منتظر کلیک کاربر...</div>

  <a-scene
    id="ar-scene"
    embedded
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiLoading: no; uiScanning: no;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="targets-root"></a-entity>
  </a-scene>

  <script>
    function printLog(msg) {
      const logEl = document.getElementById('log');
      logEl.innerText += '\n> ' + msg;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    async function runAR() {
      const btn = document.getElementById('start-button');
      const overlay = document.getElementById('start-overlay');
      const status = document.getElementById('status');
      
      btn.disabled = true;
      btn.innerText = 'در حال پردازش...';
      printLog('دکمه لمس شد.');

      try {
        const scene = document.getElementById('ar-scene');
        
        printLog('در حال گرفتن تنظیمات config.json...');
        const res = await fetch('./config.json?v=' + Date.now());
        const config = await res.json();
        printLog('فایل config دریافت شد.');

        // ساخت ویدیوها
        if (config.videos && config.videos.length > 0) {
          config.videos.forEach((item, index) => {
            const targetIdx = item[0];
            const videoPath = item[1];
            const vId = 'v-' + index;

            const v = document.createElement('video');
            v.id = vId;
            v.className = 'ar-content-video';
            v.src = videoPath;
            v.loop = true;
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            document.body.appendChild(v);

            const target = document.createElement('a-entity');
            target.setAttribute('mindar-image-target', 'targetIndex: ' + targetIdx);

            const plane = document.createElement('a-entity');
            plane.setAttribute('video-texture-plane', 'videoSelector: #' + vId);
            plane.setAttribute('scale', item[2] || '1 1 1');
            
            target.appendChild(plane);
            document.getElementById('targets-root').appendChild(target);

            target.addEventListener('targetFound', () => {
              status.innerText = 'تصویر پیدا شد!';
              printLog('Target Found: ' + targetIdx);
              v.play().catch(e => printLog('Play Error: ' + e.message));
            });

            target.addEventListener('targetLost', () => {
              status.innerText = 'دوربین را روی تصویر بگیرید';
              v.pause();
            });
          });
        }

        printLog('در حال فراخوانی سیستم دوربین...');
        const mindarSystem = scene.systems['mindar-image-system'];
        if (!mindarSystem) {
          throw new Error('سیستم MindAR بارگذاری نشده است.');
        }

        printLog('شروع استارت دوربین...');
        await mindarSystem.start();

        printLog('دوربین فعال شد!');
        overlay.style.display = 'none';
        status.innerText = 'دوربین را روی تصویر بگیرید';

      } catch (err) {
        printLog('خطا: ' + err.message);
        alert('خطا: ' + err.message);
        btn.disabled = false;
        btn.innerText = 'تلاش مجدد';
      }
    }
  </script>
</body>
</html>
